<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- PLACEHOLDER: imagem estática do modelo 3D. Substituir por um render da vista explodida real do controle. -->
  <defs>
    <radialGradient id="fundo" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#0b3c6e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#121212" stop-opacity="0"/>
    </radialGradient>
    <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#121212"/>
  <rect width="800" height="600" fill="url(#fundo)"/>
  <g transform="translate(400 0)">
    <!-- Camadas separadas, de baixo para cima -->
    <g transform="translate(0 470) skewX(-30) scale(1 .5)">
      <rect x="-200" y="-70" width="400" height="140" rx="14" fill="#2b3038" stroke="#3b424d" stroke-width="2"/>
    </g>
    <g transform="translate(0 390) skewX(-30) scale(1 .5)">
      <rect x="-110" y="-40" width="220" height="80" rx="6" fill="#3a4a5c"/>
    </g>
    <g transform="translate(0 300) skewX(-30) scale(1 .5)">
      <rect x="-185" y="-62" width="370" height="124" rx="6" fill="#0f4a86" stroke="#1d5fa8" stroke-width="2"/>
      <rect x="-150" y="-40" width="70" height="80" rx="3" fill="#c9ccd1"/>
      <rect x="-30" y="-20" width="40" height="40" rx="2" fill="#16181c"/>
      <circle cx="160" cy="-48" r="5" fill="#00edff" filter="url(#brilho)"/>
    </g>
    <g transform="translate(0 205) skewX(-30) scale(1 .5)">
      <rect x="-145" y="-50" width="290" height="100" rx="6" fill="#0a0d12" stroke="#06223f" stroke-width="3"/>
    </g>
    <g transform="translate(0 115) skewX(-30) scale(1 .5)">
      <rect x="-200" y="-70" width="400" height="140" rx="14" fill="none" stroke="#3b424d" stroke-width="22"/>
    </g>
    <g stroke="#00edff" stroke-opacity=".35" stroke-dasharray="4 8" stroke-width="2">
      <line x1="-230" y1="130" x2="-230" y2="470"/>
      <line x1="230" y1="100" x2="230" y2="440"/>
    </g>
  </g>
</svg>
