<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Portal do Cliente | DC Circuit Labs</title>
    <link rel="icon" type="image/png" href="/icone.png" />
    <style>
      :root {
        --ink-strong: #121212;
        --ink: #333333;
        --brand-blue: #007bff;
        --accent-cyan: #00edff;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #f4f7f9;
      }
      main {
        width: min(100%, 520px);
        padding: 48px 32px;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 10px 30px rgb(18 18 18 / 0.05);
        text-align: center;
      }
      img { width: 64px; height: 64px; margin: 0 auto 16px; display: block; }
      .marca { font-weight: 700; color: var(--ink-strong); letter-spacing: 0.01em; }
      .marca span { color: var(--brand-blue); }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 8px; margin: 32px 0 12px;
        font-size: 0.85rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--brand-blue);
      }
      .eyebrow i {
        width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--accent-cyan); background: #fff;
        box-shadow: 0 0 10px rgb(0 237 255 / 0.6);
      }
      h1 { font-size: 2rem; line-height: 1.15; color: var(--ink-strong); letter-spacing: -0.02em; }
      p { margin-top: 16px; line-height: 1.6; }
      a { color: var(--brand-blue); font-weight: 600; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icone.png" alt="" />
      <p class="marca">DC CIRCUIT <span>LABS</span></p>
      <p class="eyebrow"><i></i>Portal do cliente</p>
      <h1>Em breve.</h1>
      <p>Aqui você vai acessar a documentação completa dos projetos desenvolvidos com a DC Circuit Labs.</p>
      <p>Enquanto isso, fale com a gente: <a href="mailto:contato@dccircuitlabs.com">contato@dccircuitlabs.com</a></p>
      <p><a href="https://dccircuitlabs.com/">Ir para o site</a></p>
    </main>
  </body>
</html>
