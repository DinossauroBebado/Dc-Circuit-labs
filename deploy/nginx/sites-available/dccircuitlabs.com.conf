# Site institucional — https://dccircuitlabs.com
# Arquivos estáticos gerados pelo Astro em /var/www/dccircuitlabs.com/current (symlink para a versão publicada).

# HTTP → HTTPS (mantém o desafio do Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name dccircuitlabs.com www.dccircuitlabs.com;

    include snippets/dc-acme.conf;

    location / {
        return 301 https://dccircuitlabs.com$request_uri;
    }
}

# www → domínio principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dccircuitlabs.com;

    ssl_certificate     /etc/letsencrypt/live/dccircuitlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dccircuitlabs.com/privkey.pem;
    include snippets/dc-tls.conf;

    return 301 https://dccircuitlabs.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dccircuitlabs.com;

    ssl_certificate     /etc/letsencrypt/live/dccircuitlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dccircuitlabs.com/privkey.pem;
    include snippets/dc-tls.conf;
    include snippets/dc-seguranca.conf;

    root /var/www/dccircuitlabs.com/current;
    index index.html;
    error_page 404 /404.html;

    # CSS/JS/fontes com hash no nome: podem ficar em cache por um ano
    location ^~ /_astro/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
        expires 30d;
        try_files $uri =404;
    }

    location ~* \.(?:mp4|webm|jpe?g|png|webp|avif|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Versões em inglês e chinês: nunca redirecionadas pelo IP
    location /en/ {
        if ($dc_lang_na_url) {
            add_header Set-Cookie "lang=$dc_lang_na_url; Path=/; Max-Age=31536000; SameSite=Lax; Secure" always;
            return 302 $uri;
        }
        try_files $uri $uri/ =404;
    }

    location /zh/ {
        if ($dc_lang_na_url) {
            add_header Set-Cookie "lang=$dc_lang_na_url; Path=/; Max-Age=31536000; SameSite=Lax; Secure" always;
            return 302 $uri;
        }
        try_files $uri $uri/ =404;
    }

    # Português (sem prefixo): aqui entra o redirecionamento pelo IP (conf.d/dc-idioma-por-ip.conf)
    location / {
        if ($dc_lang_na_url) {
            add_header Set-Cookie "lang=$dc_lang_na_url; Path=/; Max-Age=31536000; SameSite=Lax; Secure" always;
            return 302 $uri;
        }
        if ($dc_redirecionar_idioma) {
            return 302 /$dc_redirecionar_idioma$request_uri;
        }
        try_files $uri $uri/ =404;
    }
}
