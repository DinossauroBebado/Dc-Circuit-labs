# Portal do cliente — https://portal.dccircuitlabs.com (DC-117)
# Hoje: só a página "em breve", com certificado HTTPS próprio.
# Depois: o backend do portal roda neste mesmo VPS (em /srv/apps/portal, gerenciado por pm2 ou systemd)
# e este bloco passa a encaminhar para ele — veja o trecho comentado no fim.

server {
    listen 80;
    listen [::]:80;
    server_name portal.dccircuitlabs.com;

    include snippets/dc-acme.conf;

    location / {
        return 301 https://portal.dccircuitlabs.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.dccircuitlabs.com;

    ssl_certificate     /etc/letsencrypt/live/portal.dccircuitlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.dccircuitlabs.com/privkey.pem;
    include snippets/dc-tls.conf;
    include snippets/dc-seguranca.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /var/www/portal.dccircuitlabs.com;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Quando o backend existir, troque o `location /` acima por:
    #
    # location / {
    #     proxy_pass http://127.0.0.1:3100;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    #
    # e limite tentativas de login (CNPJ + senha) com limit_req no contexto http.
}
