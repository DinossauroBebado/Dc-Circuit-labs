# Portal do cliente — https://portal.dccircuitlabs.com
# O app (Astro/Node, pasta portal/ do repositório) roda em 127.0.0.1:3100, gerenciado pelo pm2.
# Se o app estiver fora do ar, o Nginx mostra a página de manutenção em /var/www/portal.dccircuitlabs.com.

server {
    listen 80;
    listen [::]:80;
    server_name portal.dccircuitlabs.com;

    include snippets/dc-acme.conf;

    location / {
        return 301 https://portal.dccircuitlabs.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.dccircuitlabs.com;

    ssl_certificate     /etc/letsencrypt/live/portal.dccircuitlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.dccircuitlabs.com/privkey.pem;
    include snippets/dc-tls.conf;
    include snippets/dc-seguranca.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Uploads do painel (contratos, vídeos de montagem)
    client_max_body_size 500m;
    proxy_read_timeout 120s;

    # CSS/JS do portal com hash no nome: servidos direto do disco
    location ^~ /_astro/ {
        alias /srv/apps/portal/app/portal/dist/client/_astro/;
        expires 1y;
        access_log off;
    }

    # Arquivos protegidos: só o app libera, depois de conferir se o arquivo é do cliente logado
    # (resposta com "X-Accel-Redirect: /_arquivos/…"). Ninguém acessa esta pasta direto pela URL.
    location ^~ /_arquivos/ {
        internal;
        alias /srv/apps/portal/dados/arquivos/;
    }

    # Telas de acesso: limite de tentativas por IP (zona definida em conf.d/dc-portal.conf)
    location ~ ^/(entrar|esqueci-senha|admin/entrar|admin/2fa)/?$ {
        limit_req zone=portal_acesso burst=10 nodelay;
        include snippets/dc-portal-proxy.conf;
    }

    # Envio de fotos/vídeos pelo painel: o app gera as miniaturas depois de receber tudo (pode levar minutos)
    location ~ ^/admin/clientes/\d+/midias$ {
        proxy_read_timeout 600s;
        include snippets/dc-portal-proxy.conf;
    }

    location / {
        include snippets/dc-portal-proxy.conf;
    }

    # App fora do ar (deploy, reinício): página de manutenção
    error_page 502 503 504 /manutencao.html;
    location = /manutencao.html {
        root /var/www/portal.dccircuitlabs.com;
        internal;
    }
}
