server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/dccircuitlabs.com/current;
    index index.html;
    error_page 404 /404.html;

    location ^~ /_astro/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
        expires 30d;
        try_files $uri =404;
    }

    location ~* \.(?:mp4|webm|jpe?g|png|webp|avif|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
