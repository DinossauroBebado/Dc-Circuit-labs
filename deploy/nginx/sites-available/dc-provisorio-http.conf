# Configuração provisória, usada só na primeira instalação: responde na porta 80 para o
# Let's Encrypt validar os domínios antes de existirem certificados. O bootstrap-vps.sh
# remove este arquivo assim que os certificados são emitidos.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dccircuitlabs.com www.dccircuitlabs.com portal.dccircuitlabs.com;

    include snippets/dc-acme.conf;

    location / {
        return 200 "DC Circuit Labs - configurando o servidor\n";
        default_type text/plain;
    }
}
