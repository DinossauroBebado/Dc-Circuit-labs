# Encaminha para o app do portal. O app confia no X-Real-IP (para registrar acessos) e no
# X-Forwarded-Host/Proto (para validar a origem dos formulários) só porque vêm daqui.
proxy_pass http://127.0.0.1:3100;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# proxy_read_timeout fica no server (120 s) e é maior só no envio de mídias.
