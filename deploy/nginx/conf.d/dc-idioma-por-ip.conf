# Idioma inicial pelo IP do visitante (contexto http — vai em /etc/nginx/conf.d/).
#
#   Brasil e países lusófonos → português (/)
#   China, Taiwan, Hong Kong, Macau, Singapura → chinês (/zh/)
#   Demais países → inglês (/en/)
#   IP desconhecido (rede local, base sem o IP) → português
#
# A escolha manual no seletor de idioma grava o cookie `lang`, que vale mais que o IP.
# Buscadores e robôs de IA nunca são redirecionados: eles leem as três versões pelos links hreflang.
#
# Base de países: DB-IP "IP to Country Lite" (CC BY 4.0, https://db-ip.com), atualizada todo mês
# pelo timer `atualizar-geoip` (ver bootstrap-vps.sh).

geoip2 /var/lib/geoip/dbip-country-lite.mmdb {
    auto_reload 24h;
    $dc_pais country iso_code;
}

map $dc_pais $dc_idioma_por_ip {
    default en;
    ""      pt;
    BR pt; PT pt; AO pt; MZ pt; CV pt; GW pt; ST pt; TL pt;
    CN zh; TW zh; HK zh; MO zh; SG zh;
}

map $cookie_lang $dc_idioma {
    ~^(pt|en|zh)$ $cookie_lang;
    default       $dc_idioma_por_ip;
}

map $http_user_agent $dc_robo {
    default 0;
    ~*(bot|crawl|spider|slurp|facebookexternalhit|whatsapp|telegram|preview|lighthouse|inspectiontool|claude|anthropic|openai|chatgpt|perplexity) 1;
}

# Só páginas (terminam em "/" ou não têm extensão) — nunca CSS, JS, imagens, modelos 3D etc.
map $uri $dc_eh_pagina {
    default     0;
    ~/$         1;
    ~/[^./]+$   1;
}

map "$dc_eh_pagina:$dc_robo:$dc_idioma" $dc_redirecionar_idioma {
    default "";
    "1:0:en" en;
    "1:0:zh" zh;
}

# ?lang=xx nos links do seletor: grava o cookie e redireciona para a URL limpa (funciona sem JavaScript)
map $arg_lang $dc_lang_na_url {
    ~^(pt|en|zh)$ $arg_lang;
    default       "";
}
