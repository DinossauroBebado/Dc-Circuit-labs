# Ajustes gerais (contexto http).

server_tokens off;

# O Ubuntu já liga o gzip para HTML; aqui entram os demais tipos de texto e os modelos 3D.
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/plain text/xml application/javascript application/json application/xml
           image/svg+xml model/gltf-binary;
